<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>オリジナルプリントシミュレーター | SOMA NOVELTY</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    background:#f5f5f7;
    color:#222;
}

.container{
    width:95%;
    max-width:1200px;
    margin:25px auto 60px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.home-button{
    display:inline-block;
    padding:10px 16px;
    border-radius:8px;
    background:#222;
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.brand-home{
    display:inline-block;
    color:#111;
    text-decoration:none;
    font-weight:700;
    font-size:16px;
}

.brand-home:hover{
    opacity:.65;
}

h1{
    text-align:center;
    margin:8px 0;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

/* =========================
   シミュレーター
========================= */

.simulator{
    display:flex;
    gap:25px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.controls{
    width:280px;
    flex-shrink:0;
}

.controls h2{
    margin-top:0;
}

.control-group{
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select,
input[type=file],
input[type=text],
input[type=email],
input[type=tel],
textarea,
input[type=number]{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    background:#fff;
}

input[type=range]{
    width:100%;
}

.size-value,
.rotate-value{
    text-align:center;
    margin-top:5px;
    color:#666;
}

/* =========================
   ボタン
========================= */

.reset-button,
.delete-button,
.purchase-button,
.submit-button,
.back-button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.reset-button{
    background:#333;
    color:#fff;
}

.delete-button{
    background:#d9534f;
    color:#fff;
    margin-top:10px;
}

.purchase-button,
.submit-button{
    background:#111;
    color:#fff;
}

.back-button{
    background:#eee;
    color:#222;
    margin-top:10px;
}

.reset-button:hover,
.delete-button:hover,
.purchase-button:hover,
.submit-button:hover{
    opacity:.85;
}

/* =========================
   使い方
========================= */

.help{
    margin-top:22px;
    padding:15px;
    background:#f7f7f7;
    border-radius:8px;
    font-size:13px;
    line-height:1.8;
}

/* =========================
   プレビュー
========================= */

.preview{
    flex:1;
    min-width:0;
}

.product-stage{
    position:relative;
    width:100%;
    height:620px;
    background:#f3f7fb;
    border-radius:12px;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    touch-action:none;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    pointer-events:none;
}

/* =========================
   印刷範囲
========================= */

.print-zone{
    position:absolute;
    border:2px dashed #c33;
    pointer-events:none;
    z-index:5;
}

.print-label{
    position:absolute;
    top:-25px;
    left:0;

    color:#c33;
    font-size:12px;
    font-weight:bold;

    white-space:nowrap;
}

.zone-tote{
    left:29.5%;
    top:55%;
    width:42%;
    height:38%;
}

.zone-tshirt{
    left:31.8%;
    top:35%;
    width:38%;
    height:52%;
}

.zone-pouch{
    left:26%;
    top:43%;
    width:50%;
    height:28%;
}

.zone-bottle{
    left:44.5%;
    top:32%;
    width:11%;
    height:57%;
}

.zone-frame{
    left:18%;
    top:17%;
    width:64%;
    height:66%;
    border:none;
}

.zone-stand{
    left:32.8%;
    top:18%;
    width:34%;
    height:53%;
}

/* =========================
   フォトフレーム
========================= */

.frame-part{
    position:absolute;
    border:2px dashed #c33;
    pointer-events:none;
}

.frame-top{
    left:0;
    top:0;
    width:100%;
    height:14%;
    border-bottom:none;
}

.frame-bottom{
    left:0;
    bottom:0;
    width:100%;
    height:14%;
    border-top:none;
}

.frame-left{
    left:0;
    top:14%;
    width:14%;
    height:72%;
    border-right:none;
}

.frame-right{
    right:0;
    top:14%;
    width:14%;
    height:72%;
    border-left:none;
}

.frame-note{
    position:absolute;
    top:-25px;
    left:0;

    color:#c33;
    font-size:12px;
    font-weight:bold;

    white-space:nowrap;
}

/* =========================
   複数画像
========================= */

.design-item{
    position:absolute;

    width:120px;
    height:auto;

    z-index:20;

    cursor:grab;

    user-select:none;
    -webkit-user-select:none;

    touch-action:none;

    transform-origin:center center;

    border:2px solid transparent;
}

.design-item.selected{
    border:2px dashed #286b58;
}

.design-item.dragging{
    cursor:grabbing;
}

/* =========================
   選択中表示
========================= */

.selected-info{
    margin-top:10px;
    padding:10px;

    background:#f4f7f4;

    border-radius:8px;

    font-size:13px;

    text-align:center;
}

/* =========================
   購入
========================= */

.purchase-area{
    margin-top:18px;

    background:#fff;

    padding:22px;

    border-radius:15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);
}

.purchase-area h2{
    margin-top:0;
}

.order-summary{
    background:#f7f7f7;
    border-radius:10px;

    padding:15px;

    line-height:1.9;

    margin-bottom:18px;
}

.form-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:14px;
}

.full{
    grid-column:1/-1;
}

.hidden{
    display:none;
}

/* =========================
   完了
========================= */

.complete{
    padding:25px;

    background:#fff;

    border-radius:15px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.08);

    text-align:center;
}

.notice{
    font-size:13px;
    color:#666;
    line-height:1.7;
    margin-top:12px;
}

/* =========================
   スマホ
========================= */

@media(max-width:800px){

    .simulator{
        flex-direction:column;
    }

    .controls{
        width:100%;
    }

    .product-stage{
        height:500px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

</style>
</head>


<body>

<div class="container">

<div class="topbar">

    <a class="brand-home" href="../home-files/Untitled-1.html">SOMA NOVELTY</a>

    <a
        class="home-button"
        href="../home-files/Untitled-1.html"
    >
        ← トップページへ戻る
    </a>

</div>


<h1>
    オリジナルプリントシミュレーター
</h1>



<!-- =========================
     デザイン
========================= -->

<div
    id="designSection"
    class="simulator"
>

    <!-- =========================
         左側
    ========================== -->

    <div class="controls">

        <h2>
            デザイン設定
        </h2>


        <!-- 商品 -->

        <div class="control-group">

            <label for="productSelect">
                商品
            </label>

            <select id="productSelect">

                <option value="tote">
                    トートバッグ
                </option>

                <option value="tshirt">
                    Tシャツ
                </option>

                <option value="pouch">
                    ポーチ
                </option>

                <option value="bottle">
                    ボトル
                </option>

                <option value="frame">
                    フォトフレーム
                </option>

                <option value="stand">
                    木製スマホスタンド
                </option>

            </select>

        </div>


        <!-- 複数画像 -->

        <div class="control-group">

            <label for="logoUpload">
                画像を追加
            </label>

            <input
                type="file"
                id="logoUpload"
                accept="image/*"
                multiple
            >

        </div>


        <!-- サイズ -->

        <div class="control-group">

            <label for="logoSize">
                選択中の画像の大きさ
            </label>

            <input
                type="range"
                id="logoSize"
                min="30"
                max="300"
                value="120"
            >

            <div class="size-value">

                <span id="sizeValue">
                    120
                </span>

                px

            </div>

        </div>


        <!-- 回転 -->

        <div class="control-group">

            <label for="logoRotate">
                選択中の画像の回転
            </label>

            <input
                type="range"
                id="logoRotate"
                min="-180"
                max="180"
                value="0"
            >

            <div class="rotate-value">

                <span id="rotateValue">
                    0
                </span>

                °

            </div>

        </div>


        <!-- リセット -->

        <button
            type="button"
            class="reset-button"
            id="resetButton"
        >
            選択中の画像をリセット
        </button>


        <!-- 削除 -->

        <button
            type="button"
            class="delete-button"
            id="deleteButton"
        >
            選択中の画像を削除
        </button>


        <!-- 選択状態 -->

        <div
            id="selectedInfo"
            class="selected-info"
        >
            画像を追加してください
        </div>


        <!-- 使い方 -->

        <div class="help">

            <strong>
                使い方
            </strong>

            <br>

            ① 商品を選択

            <br>

            ② 「画像を追加」から画像を選択

            <br>

            ③ 画像をドラッグして配置

            <br>

            ④ 画像をクリックして選択

            <br>

            ⑤ サイズを調整

            <br>

            ⑥ 回転させる

            <br>

            ⑦ 必要なら画像を追加

            <br>

            ⑧ 「このデザインで購入する」

        </div>

    </div>


    <!-- =========================
         プレビュー
    ========================== -->

    <div class="preview">

        <div
            class="product-stage"
            id="productStage"
        >

            <img
                id="productImage"
                class="product-image"
                src="tote.png"
                alt="商品画像"
            >


            <!-- 通常印刷範囲 -->

            <div
                id="printZone"
                class="print-zone zone-tote"
            >

                <span class="print-label">
                    印刷可能範囲
                </span>

            </div>


            <!-- フレーム -->

            <div
                id="frameZone"
                class="print-zone zone-frame"
                style="display:none"
            >

                <div
                    class="frame-part frame-top"
                ></div>

                <div
                    class="frame-part frame-bottom"
                ></div>

                <div
                    class="frame-part frame-left"
                ></div>

                <div
                    class="frame-part frame-right"
                ></div>

                <span class="frame-note">
                    印刷可能範囲
                </span>

            </div>

        </div>


        <button
            type="button"
            class="purchase-button"
            id="purchaseButton"
        >
            このデザインで購入する
        </button>

    </div>

</div>


<!-- =========================
     購入確認
========================= -->

<div
    id="purchaseSection"
    class="purchase-area hidden"
>

    <h2>
        購入内容の確認
    </h2>


    <div
        class="order-summary"
        id="orderSummary"
    ></div>


    <h3>
        お客様情報
    </h3>


    <div class="form-grid">


        <div>

            <label for="customerName">
                お名前 *
            </label>

            <input
                type="text"
                id="customerName"
                placeholder="例：藤野 健太"
            >

        </div>


        <div>

            <label for="customerEmail">
                メールアドレス *
            </label>

            <input
                type="email"
                id="customerEmail"
                placeholder="example@email.com"
            >

        </div>


        <div>

            <label for="customerPhone">
                電話番号 *
            </label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="090-0000-0000"
            >

        </div>


        <div>

            <label for="customerAddress">
                住所 *
            </label>

            <input
                type="text"
                id="customerAddress"
                placeholder="〒000-0000 広島県〇〇市..."
            >

        </div>


        <div class="full">

            <label for="customerNote">
                備考
            </label>

            <textarea
                id="customerNote"
                rows="4"
                placeholder="納期・印刷についてのご希望など"
            ></textarea>

        </div>

    </div>


    <button
        type="button"
        class="submit-button"
        id="submitOrder"
    >
        この内容で注文する

    <button
        type="button"
        class="back-button"
        id="backToDesign"
    >
        ← デザインに戻る
    </button>


    <div class="notice">

        ※「注文する」を押すとメールソフトが起動します。

    </div>

</div>


<!-- =========================
     完了
========================= -->

<div
    id="completeSection"
    class="complete hidden"
>

    <h2>
        ご注文依頼を受け付けました
    </h2>

    <p>
        メールソフトから送信された内容をご確認ください。
    </p>

    <a
        class="home-button"
        href="../home-files/Untitled-1.html"
    >
        トップページへ戻る
    </a>

</div>


</div>


<script>

/* =====================================================
   商品
===================================================== */

const products = {

    tote:{
        name:"トートバッグ",
        image:"tote.png",
        zone:"zone-tote"
    },

    tshirt:{
        name:"Tシャツ",
        image:"tshirt.png",
        zone:"zone-tshirt"
    },

    pouch:{
        name:"ポーチ",

        zone:"zone-pouch"
    },

        name:"ボトル",

        zone:"zone-bottle"
    },

    frame:{

        image:"photo-frame.png",
        zone:"zone-frame"
    },

        name:"木製スマホスタンド",
        image:"smartphone-stand.png",
        zone:"zone-stand"
    }

};


/* =====================================================
   URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const selectedProduct =
    urlParams.get("product");


/* =====================================================

const productSelect =
    document.getElementById(
        "productSelect"
    );

    );

    );

    );

    );

    );

    document.getElementById(

    );

    document.getElementById(
        "frameZone"
    );

    document.getElementById(
        "resetButton"
    );

const deleteButton =
    document.getElementById(
        "deleteButton"
    );

const selectedInfo =
    document.getElementById(
        "selectedInfo"
    );

const designSection =
    document.getElementById(
        "designSection"
    );

const purchaseSection =
    document.getElementById(
        "purchaseSection"
    );

const completeSection =
    document.getElementById(
        "completeSection"
    );

const orderSummary =
    document.getElementById(
        "orderSummary"
    );


/* =====================================================
   複数デザイン管理
===================================================== */

let designs = [];

let selectedDesign = null;

let designNumber = 0;

let currentProduct = "tote";


/* =====================================================
   商品変更
===================================================== */

function changeProduct(productName){

    const product =
        products[productName];

    if(!product){
        return;
    }

    currentProduct =
        productName;


    productImage.src =
        product.image;


    if(productName === "frame"){

        printZone.style.display =
            "none";

        frameZone.style.display =
            "block";

    }

    else{

        frameZone.style.display =
            "none";

        printZone.style.display =
            "block";

        printZone.className =
            "print-zone " +
            product.zone;

    }


    /*
       商品変更時は
       既存画像をすべて中央付近へ
    */

    designs.forEach(
        function(design){

            keepDesignInside(
                design
            );

        }
    );

}


/* =====================================================
   商品選択
===================================================== */

productSelect.addEventListener(
    "change",
    function(){

        changeProduct(
            this.value
        );

    }
);


/* =====================================================
   URLの商品
===================================================== */

if(
    selectedProduct &&
    products[selectedProduct]
){

    currentProduct =
        selectedProduct;

    productSelect.value =
        selectedProduct;

}


changeProduct(
    currentProduct
);


/* =====================================================
   画像追加
===================================================== */

logoUpload.addEventListener(
    "change",
    function(){

        const files =
            Array.from(
                this.files
            );


        if(
            files.length === 0
        ){

            return;

        }


        files.forEach(
            function(file){

                if(
                    !file.type.startsWith(
                        "image/"
                    )
                ){

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    function(event){

                        addDesign(
                            event.target.result
                        );

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        /*
           同じ画像を再度選択できるようにする
        */

        this.value = "";

    }
);


/* =====================================================
   デザイン追加
===================================================== */

function addDesign(src){

    designNumber++;


    const img =
        document.createElement(
            "img"
        );


    img.src =
        src;


    img.className =
        "design-item";


    img.dataset.id =
        designNumber;


    img.style.width =
        "120px";


    img.style.display =
        "block";


    img.style.left =
        "50%";


    img.style.top =
        "50%";


    img.style.transform =
        "translate(-50%, -50%) rotate(0deg)";


    productStage.appendChild(
        img
    );


    const design = {

        id:designNumber,

        element:img,

        size:120,

        rotation:0,

        x:0,

        y:0,

        dragging:false,

        dragOffsetX:0,

        dragOffsetY:0

    };


    designs.push(
        design
    );


    /*
       少しずつずらして表示
    */

    const stageRect =
        productStage.getBoundingClientRect();


    design.x =
        (
            stageRect.width -
            120
        ) / 2 +
        (
            designs.length - 1
        ) * 15;


    design.y =
        (
            stageRect.height -
            120
        ) / 2 +
        (
            designs.length - 1
        ) * 15;


    img.style.left =
        design.x + "px";


    img.style.top =
        design.y + "px";


    img.style.transform =
        "rotate(0deg)";


    selectDesign(
        design
    );


    setupDesignDrag(
        design
    );


    keepDesignInside(
        design
    );

}


/* =====================================================
   デザイン選択
===================================================== */

function selectDesign(design){

    designs.forEach(
        function(item){

            item.element.classList.remove(
                "selected"
            );

        }
    );


    selectedDesign =
        design;


    if(design){

        design.element.classList.add(
            "selected"
        );


        logoSize.value =
            design.size;


        sizeValue.textContent =
            design.size;


        logoRotate.value =
            design.rotation;


        rotateValue.textContent =
            design.rotation;


        selectedInfo.textContent =
            "画像 " +
            design.id +
            " を選択中";

    }

    else{

        selectedInfo.textContent =
            "画像を選択してください";

    }

}


/* =====================================================
   画像クリック
===================================================== */

function setupDesignDrag(design){

    const img =
        design.element;


    img.addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();


            selectDesign(
                design
            );


            design.dragging =
                true;


            img.classList.add(
                "dragging"
            );


            img.setPointerCapture(
                event.pointerId
            );


            const rect =
                img.getBoundingClientRect();


            design.dragOffsetX =
                event.clientX -
                rect.left;


            design.dragOffsetY =
                event.clientY -
                rect.top;

        }
    );


    img.addEventListener(
        "pointermove",
        function(event){

            if(
                !design.dragging
            ){

                return;

            }


            event.preventDefault();


            const stageRect =
                productStage.getBoundingClientRect();


            let x =
                event.clientX -
                stageRect.left -
                design.dragOffsetX;


            let y =
                event.clientY -
                stageRect.top -
                design.dragOffsetY;


            design.x =
                x;


            design.y =
                y;


            img.style.left =
                x + "px";


            img.style.top =
                y + "px";


            keepDesignInside(
                design
            );

        }
    );


    img.addEventListener(
        "pointerup",
        function(event){

            design.dragging =
                false;


            img.classList.remove(
                "dragging"
            );


            try{

                img.releasePointerCapture(
                    event.pointerId
                );

            }

            catch(error){}

        }
    );


    img.addEventListener(
        "pointercancel",
        function(){

            design.dragging =
                false;


            img.classList.remove(
                "dragging"
            );

        }
    );

}


/* =====================================================
   サイズ変更
===================================================== */

logoSize.addEventListener(
    "input",
    function(){

        if(
            !selectedDesign
        ){

            return;

        }


        const size =
            Number(
                this.value
            );


        selectedDesign.size =
            size;


        selectedDesign.element.style.width =
            size + "px";


        sizeValue.textContent =
            size;


        keepDesignInside(
            selectedDesign
        );

    }
);


/* =====================================================
   回転
===================================================== */

logoRotate.addEventListener(
    "input",
    function(){

        if(
            !selectedDesign
        ){

            return;

        }


        const rotation =
            Number(
                this.value
            );


        selectedDesign.rotation =
            rotation;


        selectedDesign.element.style.transform =
            "rotate(" +
            rotation +
            "deg)";


        rotateValue.textContent =
            rotation;


        keepDesignInside(
            selectedDesign
        );

    }
);


/* =====================================================
   デザインを印刷範囲内に
===================================================== */

function keepDesignInside(design){

    if(!design){
        return;
    }


    const img =
        design.element;


    const stageRect =
        productStage.getBoundingClientRect();


    /*
       フォトフレーム
    */

    if(
        currentProduct ===
        "frame"
    ){

        keepDesignInsideFrame(
            design
        );

        return;

    }


    const zone =
        printZone.getBoundingClientRect();


    const imgRect =
        img.getBoundingClientRect();


    let x =
        parseFloat(
            img.style.left
        );


    let y =
        parseFloat(
            img.style.top
        );


    if(isNaN(x)){
        x = 0;
    }


    if(isNaN(y)){
        y = 0;
    }


    const zoneLeft =
        zone.left -
        stageRect.left;


    const zoneTop =
        zone.top -
        stageRect.top;


    const zoneRight =
        zone.right -
        stageRect.left;


    const zoneBottom =
        zone.bottom -
        stageRect.top;


    const width =
        imgRect.width;


    const height =
        imgRect.height;


    /*
       回転した画像の外接矩形
       も考慮
    */

    const rotatedWidth =
        imgRect.width;


    const rotatedHeight =
        imgRect.height;


    const maxX =
        zoneRight -
        rotatedWidth;


    const maxY =
        zoneBottom -
        rotatedHeight;


    x =
        Math.max(
            zoneLeft,
            Math.min(
                maxX,
                x
            )
        );


    y =
        Math.max(
            zoneTop,
            Math.min(
                maxY,
                y
            )
        );


    img.style.left =
        x + "px";


    img.style.top =
        y + "px";


    design.x =
        x;


    design.y =
        y;

}


/* =====================================================
   フォトフレーム
===================================================== */

function keepDesignInsideFrame(design){

    const img =
        design.element;


    const frame =
        frameZone.getBoundingClientRect();


    const stage =
        productStage.getBoundingClientRect();


    const imgRect =
        img.getBoundingClientRect();


    let x =
        parseFloat(
            img.style.left
        );


    let y =
        parseFloat(
            img.style.top
        );


    if(isNaN(x)){
        x = 0;
    }


    if(isNaN(y)){
        y = 0;
    }


    const frameLeft =
        frame.left -
        stage.left;


    const frameTop =
        frame.top -
        stage.top;


    const frameRight =
        frame.right -
        stage.left;


    const frameBottom =
        frame.bottom -
        stage.top;


    const width =
        imgRect.width;


    const height =
        imgRect.height;


    x =
        Math.max(
            frameLeft,
            Math.min(
                frameRight -
                width,
                x
            )
        );


    y =
        Math.max(
            frameTop,
            Math.min(
                frameBottom -
                height,
                y
            )
        );


    img.style.left =
        x + "px";


    img.style.top =
        y + "px";


    design.x =
        x;


    design.y =
        y;

}

);


/* =====================================================
   選択中画像を削除
===================================================== */

deleteButton.addEventListener(
    "click",
    function(){

        if(
            !selectedDesign
        ){

            alert(
                "削除する画像を選択してください。"
            );

            return;

        }


        const index =
            designs.indexOf(
                selectedDesign
            );


        if(index !== -1){

            designs.splice(
                index,
                1
            );

        }


        selectedDesign.element.remove();


        selectedDesign =
            null;


        selectedInfo.textContent =
            designs.length > 0
            ? "画像を選択してください"
            : "画像を追加してください";


        if(
            designs.length > 0
        ){

            selectDesign(
                designs[
                    designs.length - 1
                ]
            );

        }

    }
);
